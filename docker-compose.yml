services:
  mongo:
    image: mongo:7
    container_name: waste-x-change-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: wx_admin
      MONGO_INITDB_ROOT_PASSWORD: passwordLocalServer
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
